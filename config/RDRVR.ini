; The foregrip held still on the gun: each gun's grip (where John's front hand snaps, and its ring) the mean of its first
; 30 samples of the game's hold, then kept (run 8: re-learned every frame, it followed the game's own arm sway, 1-4 cm).
; 1 = on.
SteadyRing=1
; While held with both hands, the game's aim stance is kept (LT held for you): its support-hand grip under the barrel,
; and every pull fires at once (whatever [Hands] TriggerAims is). 1 = on.
TwoHandedAims=1
; The foregrip: the game's grip on the drawn gun moved right / up / forward (metres, the gun's axes): where John's front
; hand sits. ForegripRadius: the ring's size when ForegripZoneRadius is not set (before run 6 it was the ring's size).
ForegripOffset=-0.005 0.000 0.000
ForegripRadius=0.110
; Each long gun's front hand pose, in its own section ([Weapon.Henry] FrontHandPose=lowered; the menu's "The gun in
; hand" page): aiming (the default since 0.7.0: the game's aiming hold and the fingers its hand had in it, whatever the
; stance), lowered (that hold), or auto (the game's stance picks its lowered or aiming hold, as before 0.7.0). A hold
; the game has not shown on that gun yet this session gives the other.
; The foregrip ring (run 6): where your front hand takes hold of the gun, moved from the grip right / up / forward
; (metres, the gun's axes), and its size, ForegripZoneRadius (not set here: unset, it is ForegripRadius); John's hand
; still sits at the grip. The Holsters tab's rings show it, the Reloading tab sets both.
ForegripZoneOffset=0 0 0
; Where a round goes into the gun in hand (run 6): the loading point, 0.10 m out along the barrel from the gun hand's
; wrist, moved right / up / forward (metres, the gun's axes), and the ring's size: a round held within it goes in (let
; go: within it and 4 cm more). InsertOnTouch: the round itself touching the ring puts it in, the grip still held (the
; round is drawn at your fingertips, ahead of the wrist). 1 = on (the default); 0: the wrist within the ring. The
; Reloading tab has them.
LoadPointOffset=-0.045 0.045 0.065
LoadPointRadius=0.075
InsertOnTouch=1

[Physics]
; Grabbing loose props (run 5; the Gestures tab): an empty hand gripping at a loose prop (a bottle, a chair, a crate)
; holds it at the palm, frozen; letting go throws it with the hand's speed (times ThrowGain, at most ThrowMax m/s).
; While on, an empty hand's grip reaches the game (LB/RB) only once no prop was found there (a few frames late). NPCs
; are never grabbed. 1 = on.
Grab=0
GrabRadius=0.15
ThrowGain=1.0
ThrowMax=12.0
; Hands that push loose objects (run 3; the Gestures tab): an empty hand moving through a bottle, a crate or a chair
; pushes it along the hand, through the game's own natives (never an actor: NPCs react to [Gestures] Melee). 1 = on.
HandCollision=0
; the prop's speed along the hand per the hand's speed, its cap (m/s), the slowest hand that pushes (m/s), the reach from
; the palm to the prop's origin (m), and the time between a hand's pushes (ms)
PushGain=1.2
PushMax=5.0
PushMinSpeed=0.5
PushRadius=0.35
PushCooldownMs=120
; each distinct prop touched pins one of the game's 1024 script references for the session: at most this many props, and
