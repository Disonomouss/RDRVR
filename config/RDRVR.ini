; RDRVR settings, shipped with every build. Every key is listed here with its default and a comment.
; Your own changes (from the in-headset menu) go to %LOCALAPPDATA%\RDRVR\RDRVR.user.ini, which overrides this
; file and is never overwritten by a release or a test.
;
; This is the release profile (RDRVR 0.8.1): the headset image and first person on, and the features and tuning
; of the developer's own headset sessions (2026-10-07; the grips, places and markers 2026-10-10): the guns' actions by hand, dual wielding, swings, the guns at
; the holsters, the wrist HUD, and the holsters' and rings' places. Each can be changed in the in-headset menu. The
; game's own settings (graphicsOptions.xml) are never written.

[Debug]
; Every 10 s with an item in hand, "[follow] auto" lines in RDRVR.log: each drawn gun (the gun in hand, the own model,
; the copy) against its drawn wrist, per eye: its worst offset with the hand still and with it moving fast (a gun drawn
; a frame late: its offset grows with the hand's speed). Its cost: within 0.05 ms of scene render. 1 = on.
FollowLog=1
; Each shot with a long gun held two-handed: a "[two] a shot two-handed" line in RDRVR.log 300 frames later (3.3 s at
; 90 Hz), how far the front hand moved on the drawn gun through the shot (the worst move, mm; where it was on the gun
; first and last; the gun's own move), the two-handed blend and the front hand's hold at the shot and after. 1 = on.
TwoHandShotLog=1
; Arm D3D12 DRED (auto-breadcrumbs, page-fault allocation reporting) before the game creates its device, so a GPU
; device removal is logged with the failing command list and resource. 1 = on.
Dred=1
; Hook resource creation and SetName and log render-target and depth allocations with their names. 1 = on.
LogResources=1
; Install the command-list hooks for the frame-graph capture (the harness arms a capture with "fg N"). 1 = on.
FrameGraph=1
; Count grcViewport::SetCurrent calls per frame by call site (the R0 view census). 1 = on.
Census=1
; Count the per-draw shader-globals push 0x130e60 (dev builds only; runs once per draw). 0 = off.
PushGlobalsProbe=0
; The upscaler's alignment, measured in a headset session: this many sets of 16 frames (the second eye's post output,
; the upscaler's input and motion vectors, the jitter) taken by themselves, the first after AutoAlignDelay seconds of
; submitted frames, then 10 s apart, into %LOCALAPPDATA%\RDRVR\align\ (about 120 MB a set; a maintainer's tool reads
; them). 0 = off.
AutoAlignGrab=0
AutoAlignDelay=45
; Write the decrypted .text region RVA 0x1000..0x101000 to RDRVR_text_dump.bin at startup (for Ghidra). 1 = on.
DumpText=0
; Milliseconds without a Present before the hang log writes every thread's location.
HangMs=10000
; At a hang, also read the game's D3D command recorder and its playback (its chunks and queues, the frame semaphores, the
; stuck frames' registers, the packets about the read point): reads only, once (for the rare freeze in the README's
; known issues). 0 = off.
HangRecorderDump=0
; A test of the start on a game executable without the MTLX stage (run 8): the hooks' no-wait branch taken on this one
; (on the Steam executable only once MTLX has unloaded). The mod finds such an executable by itself. 0 = off.
ForceNoMtlx=0
; A test of [Render] RenderResolution in the game's other screen type: fullscreen or windowed sets the game's own
; -fullscreen / -windowed at the start, with the size (graphicsOptions.xml keeps your own Fullscreen). Empty = off.
ForceScreenMode=
; Write RDRVR_build_report.txt (where this RDR.exe keeps each code and data anchor) even when it is the analysed
; build; on another build it is always written (and with Relocate below the mod runs there when every anchor is
; found and checked, else it stands down). 0 = off.
BuildReport=0
; On another build of RDR.exe: when the scan finds and checks every anchor (RDRVR_build_report.txt), run on the
; addresses it found instead of standing down. 1 = on.
Relocate=1
; Test only: run the scan and the relocation on the analysed build too (every shift 0). 0 = off.
RelocateTest=0
; With [Render] RenderResolution in Windowed mode: the window at the game's own size (the frame scaled into it).
; 0 = the window at the frame's size (larger than the screen: partly off it). 1 = on.
RenderResolutionKeepWindow=1
; Run an idle OpenXR session (no layers) once the game's D3D12 device is up. 1 = on.
XrIdle=1
; Measure the constant upload ring (root CBV binds and CBV descriptors per upload buffer, head advance per frame) and
; the occlusion-query pool head, logged as [ring] every 600 frames (Spike S1's runtime checks). 1 = on.
RingProbe=1
; Fixed render scale through the DRS controller's fixed-scale path (S10's resolution sweep without a display-mode
; change): 0 = off, 0.25..1.0. Needs [Render] ForceAntiAliasing. The test command "renderscale <x>" changes it live.
FixedRenderScale=0
; The OpenXR Simulator's frame rate (it reads SIMXR_FPS, set in-process here): 0 = its default 90 Hz; e.g. 72 or 120.
SimulatorFps=0
; Hook the action trees' transition ops and weapon ops for "holster trace" (research: every actor's ops pass the hook
; each frame). 0 = off.
ActionTrace=0
; Test only: controller poses and buttons from the command channel ("hand l|r ..."), for the simulator, which maps
; only mouse and keyboard to controllers. 0 = the real controllers. Never 1 in a release.
SyntheticHands=0

[Input]
; Virtual pad: pad 0 always reports a connected gamepad, so the game keeps polling it and the mod can drive it
; (with no real pad the game stops polling after its startup query). 1 = on.
VirtualPad=1
; The game's rumble on the VR controllers (left motor -> left hand, right motor -> right hand); strength 0..2.
Haptics=1
HapticStrength=1.0

[Aim]
; Perfect accuracy (run 3; the Controls tab): every shot of the player's leaves exactly along the barrel. The game's own
; random spread (its bloom: none while the barrel ray hits something within the weapon's inaccuracy range, up to about
; 1.8 degrees when it hits nothing near, e.g. aiming at the sky or across open country) is skipped, the shot follows
; the barrel ray of that very frame, a muzzle the game thinks is inside a wall no longer bends the shot to the game's own
; gun, and John's own speed is not added to the bullet. 1 = on (the default since run 8); 0 = the game's spread.
PerfectAccuracy=1
; The shotgun's pellets in the game's cone around the shot's line; 0 = every pellet along that one line (the same
; pellets and damage, one point): the barrel with PerfectAccuracy, else the game's spread still turns the whole shot.
; 1 = the game's cone.
ShotgunPattern=1

[Render]
; Batched hand-off to the GPU thread (new): the game's D3D12 playback thread takes the render thread's recorded commands
; in batches of K, once K are recorded or the recorder pauses, instead of one at a time (the two threads otherwise trade
; one cache line on every command): about 2.5-3 ms less CPU a frame, nothing drawn differently. 256 = on; 0 = one at a
; time through the mod (the menu's General tab switches between the two while you play); -1 = the game's own loop,
; untouched (from the next start).
PlaybackBatch=256
; Room for the game's constant-buffer descriptors, added to its 40,000: stereo draws the scene twice and needs about
; twice the flat game's; past the limit the game stops itself (crash). 0 = the game's size.
ConstantBufferHeadroom=40000
; Anti-aliasing forced in memory for bring-up: -1 = the game's own setting, 0 = Off, 1 = FXAA, 2 = native TAA (the
; engine's technique 2, whose resolve the mod draws with the game's own TAAResolve shader, one history per eye). FXAA
; and Off have no temporal jitter, so frames can be compared pixel for pixel (R1/R3 gates). The test command
; "aa off|fxaa|taa" switches at run time. The game's menu still shows its own value. 3 = DLSS (the game's own,
; technique 5, frame generation and dynamic resolution off; set at boot only, never at run time; a history per eye,
; DlssPerEye below).
ForceAntiAliasing=1
; With ForceAntiAliasing=3: the game's DLSS quality index, 0 = DLAA (native resolution), 1 = dynamic, 2 = ultra
; performance, 3 = performance, 4 = balanced, 5 = quality.
DlssQuality=0
; With ForceAntiAliasing=3 in stereo: the first eye's post run made with DLSS (else both eyes get one image), and each
; eye's scene pass jittered as the native TAA's are (the tick's sample in both eyes). 1 = on.
DlssFirstEye=1
DlssPassJitter=1
; With ForceAntiAliasing=3 in stereo: a DLSS history per eye (the first eye on a second DLSS viewport, its own NGX
; instance), so neither eye reprojects the other's last image. Experimental; on the first failed DLSS call it turns
; itself off (both eyes on one viewport again). 1 = on (the default with DLSS).
DlssPerEye=1
; DLSS's jitter sequence at the length NVIDIA asks for, 8 x (output / render size)^2: 18 samples at Quality, 72 at
; Ultra Performance. The game leaves it at DLAA's 8 for every quality, too few positions for the upscale. 1 = on.
DlssFullJitter=1
; DLSS's jitter in render pixels, as DLSS is told (the game moves the image by the jitter in output pixels, 0.667 of a
; render pixel at Quality: the samples never cover the pixel). 1 = on.
DlssJitterUnits=1
; The game's frame size apart from the monitor's modes and the window (DSR not needed), from the next start: off = the
; game's own (its Graphics menu), auto = 16:9 at the height the headset's runtime asked for in the last session (times
; [XR] EyeScale and RenderScale; never below the game's own), or your own size: a height (16:9, e.g. 2208 for a Quest
; 3's eye) or WxH (16:9 only, up to 9998x5624). The menu picks a headset and 100%, 150% or 200% of its pixels and
; writes RenderHeadset and RenderScale beside the size; a size written here by hand is kept as written (the menu then
; shows it as Custom). A headset's height is its screen's; the runtime (SteamVR, Pimax Play, Virtual Desktop...) may
; ask for another size for its lenses: auto takes exactly that one (the runtime's own resolution setting multiplies
; with RenderScale: keep it at its default, SteamVR's 100%). Each eye is the game's frame, or with [XR] EyeShape at most this tall. In Windowed mode the
; window keeps its size (the frame is scaled into it); graphicsOptions.xml keeps the game's own size. Tried in
; Windowed mode only. Refused below 2560 MB of VRAM or above about a third of it, and blocked after a start at a size
; that ended within two minutes without quitting (until it, or another size, is chosen).
RenderResolution=off

[Compat]
; End the process with TerminateProcess when the game exits, so no DLL detach code runs: RedHook v0.8's own detach
; crashes when its DirectXHook is disabled (as RDRVR runs it), which made every graceful quit a crash report. The
; game's own exit work (CRT atexit, static destructors) has already run by then. 1 = on.
TerminateAtExit=1
; R3: FUN_140706050 (the depth/shadow pre-pass) builds its bucket masks from uninitialised stack, so the buckets drawn
; depend on what an earlier call left there (a vanilla bug that makes two eye passes differ). An entry stub zeroes the
; four slots as a fresh stack would; the game's code is not patched. 1 = on (runtime switch: "split masks on|off").
DrawMaskInit=1

[Stereo]
; God rays: an eye the sun is behind draws none (with the game camera facing the sun and your head turned away, the
; rays otherwise glow ahead of you). 0 = the game's own test only.
SunBehindCheck=1
; R3 dual eye pass (the test command "double on <ipd> [swap]"): per-frame engine state the second scene pass would
; see consumed or advanced, each kept so both passes see the frame as one pass does.
; Runtime switches: "split <name> on|off". 1 = on.
Split_grass=1
Split_gust=1
Split_lights=1
Split_forest=1
; The post chain run for the first eye between the passes (its own image; without it only the second eye has one).
Split_post=1
Split_masks=1
; One exposure writer (R4a): the first eye's post run adapts the exposure, the second eye's run reuses that value
; (its adaptation pass skipped), so both eyes share one exposure that advances once per frame. 0 = each run adapts.
Split_exposure=1
; Particles simulated once (R4b): the GPU rain is stepped in the first pass only and its draw's camera-velocity
; smoother is shared by both eyes; the particle collision map is rendered in the first pass only.
Split_rain=1
Split_pfxmap=1
; God rays per eye: the first eye gets its own god-ray history (a pair made once by the game's own creator), so
; neither eye blends the other eye's rays.
Split_godrays=1
; Ped wetness and blood updated once per frame (the first pass only), so both eyes see the same wet hair and cloth.
Split_damage=1
; Cloud shadows scrolled once per frame (the second pass reuses the first's scroll), and the sun-visibility averages
; smoothed once per frame.
Split_clouds=1
Split_sunvis=1
; Measurement aid: undo every post run's exposure step, so captures share one exposure state. 0 = off.
Split_hold=0
; Shared shadows (on since 2026-10-10, after a headset session): the sun's cascades, the lamps' cube shadows and the
; spot shadows are drawn once per frame, fitted for both eyes, and the second eye reuses them: about 0.9 ms less CPU
; and some GPU a frame. 0 = drawn for each eye (as before). Split_shadowunion is its test control (both eyes fitted
; for both, nothing reused). Runtime switches: "split shadows on|off", "split shadowunion on|off"; the menu's General tab.
Split_shadows=1
Split_shadowunion=0

[XR]
; R5 step 1: submit the eye images to the OpenXR runtime as a projection layer, one XR frame per game frame (the frame
; loop moves to the game's presenting thread and paces it). Needs [Debug] XrIdle=1. 0 = off (the idle session).
Submit=1
; The eye images converted for the runtime: the game's final gamma (its Apply360GammaCorrect, Gamma read live) into
; sRGB swapchains, so the headset shows the colours the monitor shows. 0 = raw RGBA16F copies (R5 step 1; washed out).
ColourBlit=1
; The UI (HUD, menus) kept out of the eye images and shown on its own quad 2 m ahead that follows the head lazily; the
; monitor gets the UI drawn back over its image. Applies while the submission runs. 0 = the UI stays in the game's image
; (and is then missing from the eye images).
UiQuad=1
; Where the HUD goes with UiQuad: quad = the floating quad (all of it); wrist = the radar, its meters and the ammo
; counter on the back of the left hand (the right one when left-handed), shown while you look at it (palm flat, face
; down, like a watch), the prompts still on the quad.
Hud=wrist
; The wrist HUD's part of the screen: left top right bottom, fractions of the screen (the radar's corner, with the
; ammo counter above the radar).
WristHudRect=0.02 0.63 0.34 0.96
; The UI quad's image at most this many pixels wide: up to it the UI is shown at the game's own size, pixel for pixel.
; The quad is 1.8 m wide at 2 m (about 48 degrees), where a wider image is only shrunk again without mipmaps, so a
; larger frame's UI ([Render] RenderResolution, a 4K monitor) is filtered down into it, which keeps its text from
; shimmering; the wrist HUD's image follows at the same scale. 0 = only the runtime's largest image limits it.
UiQuadMaxWidth=2560
; The cinema screen's image at most this many pixels wide: the screen is 3.2 m wide at 3 m (about 56 degrees), where a
; 3840-wide image is only shrunk again without mipmaps. A larger frame is filtered down into it (as is one the game's
; Graphics menu resized while it runs); at this width or below the frame is copied as it is. 0 = only the runtime's
; largest image limits it.
CinemaMaxWidth=2560
; Cull for the head: with the eyes from the headset, the game's visibility uses the centre eye's pose and a frustum over
; both eyes' fields of view plus 4 degrees, so turning the head never shows culled objects. 0 = the game camera's.
HeadCover=1
; Distant tree billboards: with the eyes from the headset they face the centre of your eyes and stay upright (your
; head's yaw only), so they do not turn as you look around. 0 = they face the game camera, as on a monitor.
LevelBillboards=1
; The forest manager's billboards (grass and distant vegetation) stay upright instead of tilting with your head.
; 0 = they face the eye's view plane, as on a monitor.
LevelGrass=1
; The forest's own view (tree LOD and facing) uses your head's yaw only, level, while culling still covers your whole
; view. 0 = it uses the cull camera, which follows your head's tilt.
LevelForestView=1
; Distant trees' pictures (one per tree type, re-drawn a few per frame): captured along the game camera's heading
; instead of your eye's view, so they do not spin with your head (run 2; round 7 confirmed). 0 = the game's.
LevelImposters=1
; View modes while the submission runs: stereo in gameplay; the cinema screen for loading screens, bink, the front end,
; the pause menu and fades (and cutscenes, see [Screen] CutsceneMode). 0 = the test commands set the view.
AutoMode=1
; Pacing: while the submission runs, the game presents without vsync and the runtime's frame loop paces it (the game's
; own frame limit still applies). 0 = the game's vsync setting.
Pacing=1
; Late latch: just before the first eye pass the head orientation is read again for the same display time (positions
; stay those of the frame's start); the eyes are drawn and submitted with it. 0 = the frame-start views only.
LateLatch=1
; Every this many seconds of headset frames, one "[xr] timing" line in the log: the frame rate, missed display
; periods and the longest gap, the xrWaitFrame wait, how long each frame was open, CPU and GPU, the pose check, the late
; latch (for judging judder from a session's log). 0 = off.
TimingLog=10
; With each timing line, a second one splitting the frame by thread (new in 0.8.0, for measuring stereo's cost):
; each eye's pass, the first eye's post, the waits between the game's threads, the playback thread's busy and idle
; time. Timers once a pass or wait, never per draw. 1 = on.
TimingProbe=1
; The hands' late latch (round 9: after vigorous movement the gun shook or lagged a bit): at the scene's start, before
; the body's arms are solved, both controllers' poses are located again for the same display time, so the hands use
; the runtime's latest prediction, as the head does. 0 = the poses from the frame's start.
LateLatchHands=1
; Eyes in the headset's own shape (run 7): each eye rendered at the runtime's recommended height (times EyeScale, at
; most the game's own height) and as wide as the eye's field of view needs, so its pixels are square, instead of the
; game's 16:9 frame stretched over a nearly square view (about 45% of its width wasted). It renders inside the game's
; own targets, as the game's dynamic resolution does, and keeps the UI, the wrist HUD and the cinema screen as they
; are; the monitor shows the left eye in the middle. Needs [Render] ForceAntiAliasing=1 (FXAA): refused otherwise.
; Set before the headset session starts (the eye images are sized then). 0 = the game's 16:9 frame.
EyeShape=0
; The eye height against the runtime's recommended one, 0.25 to 2: below 1 fewer pixels (faster), above 1 sharper.
; The game's height caps it: raise the game's resolution for the full density (2208 tall on a Quest 3).
EyeScale=1.0
; With DLSS (ForceAntiAliasing=3) too (new in 0.7.0; tried in a headset 2026-10-10: the same sharpness, a quarter less
; GPU time): the eye shape's smaller image upscaled by DLSS into an eye-shaped output, both eyes. 1 = on (with
; EyeShape=1). The menu's General tab, "Eyes in the headset's shape with DLSS", sets both for the next start.
EyeShapeDlss=0

[Body]
; Camera anchor (G-B): in gameplay stereo the view sits at the player's root plus the eye height, 5 cm forward, level,
; facing the body's heading, and the head pose since recentre moves it from there (no head bone, no walk bob).
; 0 = the game's own camera (third person) composed with the head pose. Off until judged in the headset.
; Recentre (view, body heading, cinema screen and HUD in front again): the headset's own recentre (Quest: hold
; the Oculus button), Scroll Lock with the game in front, both stick clicks (L3 + R3) held for a second, or the
; menu's Comfort tab.
CameraAnchor=1
; Keep first person (new in 0.7.0): when a script switches to its own camera (a shopkeeper's, a mission's scripted
; shot; not cutscenes), the first-person view is made current again every script tick, so shops and missions stay first
; person. Only acts with CameraAnchor=1. 1 = on; 0 = the script's own camera is shown (try 0 if a mission scene looks
; wrong, and please report it).
KeepAnchorCamera=1
; Eye height above the actor's root in metres (0 = measured from the character's head bone: true scale), the seated
; lift added to it, and the forward offset along the body's heading.
EyeHeight=0
SeatedLift=0.09
EyeForward=0.05
; The world's up axis: 1 = y (the game's, measured), 2 = z.
UpAxis=1
; Which component of the scripted camera's orientation carries the heading: 1 = y (default), 0 = z, 2 = x, 3 = -y.
OrientMode=1
; Hide the player's head and hat while the camera anchor puts you in first person (cutscenes and the cinema screen
; keep them). Only what is drawn changes: the head's bones are collapsed in the copy the renderer uses. 1 = on.
HideHead=1
; The drawn body in first person (only what is drawn; gameplay keeps the character's own pose and place):
; Stance = upright (spine, chest and shoulders held upright over the hips; arms and legs still animate), lean (only
; the forward/back lean of the torso removed) or game (the game's animation). UprightBone = the bone whose subtree is
; straightened. BodyBack = metres the body is drawn behind the camera's place (so looking down shows the chest from
; outside). BodyFollowsHead = 1: the body moves with the headset's horizontal offset; 0: it stays where the character is.
Stance=upright
UprightBone=spine00
BodyBack=0.04
BodyFollowsHead=0
; The drawn body faces the camera's heading, legs included (walking sideways no longer turns his shoulder into view).
LockFacing=1
; Degrees added to the upright torso (positive leans it forward; the upright pose is the model's bind orientation).
TorsoPitch=2
; The upper body kept over the hips (horizontally) as at rest, the whole body moving with it: running no longer pushes
; the torso forward into view. 1 = on.
LockTorso=1
; What of the body is drawn in first person: full, arms (the forearms and hands) or hands.
Show=arms
; While crouching, in cover, on a horse or driving a wagon, only the forearms and hands are drawn (the body gets in
; the way of the view there). 1 = on.
AutoShow=1
; With part of the body hidden: the scale its bones' matrices are drawn at, collapsed onto the line between the cuts
; (1e-7; 1e-4 was round 7's, which left a sliver from elbow to elbow), and no cloth flutter on the player's draws
; then (the game's wind pushes even collapsed cloth off that line). 1 = on.
CollapseScale=1e-7
HiddenNoFlutter=1
; The root bone collapsed onto the line between the cuts with the rest of the hidden body (one of round 7's sliver
; fixes; 0 leaves it where the game draws it). 1 = on.
CollapseRoot=1
; The hidden parts in the forearms and hands modes (the Hands tab): filter (run 3) draws the geometries that mix hidden
; and shown bones without their hidden triangles that span two cuts, the line between the elbows (float rounding of
; the collapsed points at the world's coordinates), and skips the geometries whose every bone is hidden; skip only
; does the latter (it thins the line); draw draws them all collapsed, as before. filter (default) | skip | draw.
HiddenGeometry=filter
; The item in hand (a gun, a thrown weapon) known by the matrix the game places it with: drawn on the hand and never
; hidden with the body (round 7: it vanished now and then, taken for a holster's or the head's prop). 1 = on.
HeldPropFix=1
; The held gun's model placed where it is drawn (at your hand), not at the game's animated hand: the game culls it
; there, so it vanished whenever you looked away from where the game holds it. 1 = on.
HeldPropAtHand=1
; The lasso drawn in your hands: its rope's points near each of the game's hands moved onto your drawn hand (the
; coil in the off hand, the loop in the gun hand, as the game holds it); a thrown loop's far part stays where the game
; flies it. Off: the lasso where the game's own animated hands are (in front of yours). 1 = on.
LassoAtHands=1
; The player's bored idle animations (looking around, stretching) off while in first person. 1 = on.
NoIdleAnims=1
; 1 = the model faces the root bone's -z (measured); -1 flips the body-back direction.
ForwardSign=1
; The eye height follows the head bone's height over the character's root (crouching, riding), low-passed over
; HeightSmoothing seconds so the walk bob stays out. 0 = the measured standing height always.
EyeHeightFollow=1
HeightSmoothing=0.35

[Controls]
; The VR controllers through OpenXR actions (Touch, Index, Vive, WMR, simple controller). 1 = on.
; They drive the game's pad with the buttons that share a name: A/B (right), X/Y (left), triggers LT/RT, grips LB/RB,
; sticks, stick clicks L3/R3. The menu button: tap = Start (pause), hold = the RDRVR menu, held + right stick = D-pad,
; held + A = Back (map). Both stick clicks held 1 s recentre. A gamepad keeps working alongside.
Controllers=1
; Grip pressed above this value (released 0.2 below it).
GripThreshold=0.6
; How long the menu button is held to open the RDRVR menu (milliseconds).
MenuHoldMs=600
; Controllers without a menu button (Index): both B buttons together act as the menu button. 1 = on.
MenuChord=1
; With the wrist HUD in view (the palm flat and looked at), holding the off hand's Y (its upper button) as long as
; MenuHoldMs opens or closes the menu; a short press is still Y for the game. F7 on the keyboard does the same. 1 = on.
WristMenu=1
; With the wrist HUD in view, two short presses of the off hand's Y within SatchelTapMs (ms, 150-800) open John's
; satchel (his items; the pad's Back). A single press still reaches the game as Y, SatchelTapMs after it is let go (the
; wait for a second press). The hold still opens the menu (WristMenu). 1 = on.
WristSatchel=0
SatchelTapMs=350
; The game's menus (the satchel, the pause menu, the shop): RT switches to the next tab and LT to the one before (the
; game's RB and LB), and the left stick moves one item a push (then, held, one every 0.18 s after half a second); the
; game's own stick scrolled two or three items a flick there. A menu: the game paused or its scripts stopped with its
; scene still drawn, or the shop's menu focused. 1 = on; 0: the controllers as in play.
MenuControls=1
; WMR and the Vive wands have no A / B buttons: the trackpad's click gives them (its upper half B / Y, the lower half
; A / X; on the Vive the middle stays the stick click). 1 = on.
TrackpadButtons=1
; How each controller type sits in the hand (the Hands tab's "Controller fit", for the type in use): metres right /
; up / forward and degrees pitch / yaw / roll, the right hand's (the left mirrored). Keys GripFitTouch, GripFitIndex,
; GripFitVive, GripFitWMR, GripFitPico4, GripFitPicoNeo3, GripFitHPReverb, GripFitViveCosmos, GripFitViveFocus3,
; GripFitTouchPro, GripFitTouchPlus, GripFitOdyssey, GripFitSimple, e.g. GripFitIndex=0 0 0.010 0 0 0. None: no change.
; Swap the two controllers' roles (the left trigger fires, the right stick moves). 1 = on.
LeftHanded=0
; The remap: which game button each VR button drives (also in the menu's Controls tab). Targets: none, A, B, X, Y,
; LB, RB, LT, RT, L3, R3, Back, Start, DpadUp, DpadDown, DpadLeft, DpadRight. A trigger mapped to a button presses
; it past half way; a button mapped to LT/RT pulls it fully.
RightA=A
RightB=B
LeftX=X
