[Hands]
; Dual wielding (run 3; the Hands tab): with a gun in one hand, the free hand gripping the holster of another gun slot
; (a long gun on the back with a sidearm in hand, or the hip sidearm with a long gun in hand) takes that gun as a
; second. It fires on its own controller's trigger, from its own barrel, with its own ammo (the chest squeeze loads it
; one round at a time); let go at its holster to put it back. Two-handed holds are off while it is out. 1 = on.
DualWield=1
; Dual wielding the same sidearm (run 4; the Hands tab): with a revolver or a pistol in hand, the free hand gripping a
; hip holster takes a copy of it. Both sidearms are one equip slot in the game, so the copy is the gun in hand drawn a
; second time: it fires on its own trigger, from its own muzzle (its flash too), with its own clip (loaded from the
; spare rounds when taken, one round by the chest squeeze); let go at a hip to put it back, its rounds back to the
; spare. It shows the gun in hand's model, and only while the gun in hand is drawn. 1 = on.
DualWieldCopy=1
; With DualWieldCopy: the copy shows your other sidearm's own model (run 5) when you own a different one: the gun the
; hip shows and draws (its LeftHipWeapon / RightHipWeapon, or on auto its own last gun, else the highest other sidearm
; you own) if it is another sidearm, else the first other revolver you own. The game
; draws that model at the copy's place, and the shot leaves its own muzzle; the gunshot is still the gun in hand's.
; 1 = on.
DualWieldOwnModel=1
; With DualWieldOwnModel: the free hand at the gun in hand's own holster (the one it was drawn from) takes a second of
; that gun, its own model; the other hip still gives your other sidearm (round 13). 1 = on.
DualWieldSameAtItsHolster=1
; With DualWieldOwnModel: that model is drawn where your free hand is in each frame (run 6), as the copy is; 0 = as in
; run 5, where it showed the hand of the game's last update (it lagged behind and swam as John moved). 1 = on.
OwnModelFollow=1
; The long guns held in your hand as the game holds them while aiming, in every pose: the game holds a long gun
; differently lowered or carried (the wrist higher on it). Each gun's aiming hold is built in (since 0.8.1: every gun's,
; the game's own data), learned again while the game aims (kept in the user ini's [Grips] GunHand.<gun>, which then
; wins) and used always. 0 = off (the game's own hold of each moment).
FixedGunGrip=1
; The same for the sidearms (2026-10-09, for the revolver's lag: the revolver lagged in the hand while its copy and the
; long guns, held this way, did not): each revolver or pistol's aiming hold built in (since 0.8.1), learned again while
; the game aims (kept in the user ini's [Grips] GunHand.<gun>) and used always. 0 = off (the game's own hold of each
; moment).
FixedSidearmGrip=1
; The copy of the same sidearm (DualWieldCopy) shown as a prop of that gun's model, as the other sidearm's model is
; (run 7: the gun in hand drawn a second time at the free hand was never seen there). 0 = the old second draw.
CopyAsProp=1
; The hand holding the copy (DualWieldCopy) or a second gun (DualWield) closes round its grip (run 6; round 13: every
; second gun): its fingers take the gun hand's grip, mirrored. 0 = the game's own pose for that hand (open). 1 = on.
CopyGrip=1
; Where your hands grab (the holsters, the chest's rounds, the rings, an action's parts; the white dot the holsters'
; rings show): moved from the wrist by right, up, forward (m) in your hand's axes, the left hand's right mirrored
