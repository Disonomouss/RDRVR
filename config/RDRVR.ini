; Where a round goes into the gun in hand (run 6): the loading point, 0.10 m out along the barrel from the gun hand's
; wrist, moved right / up / forward (metres, the gun's axes), and the ring's size: a round held within it goes in (let
; go: within it and 4 cm more). InsertOnTouch: the round itself touching the ring puts it in, the grip still held (the
; round is drawn at your fingertips, ahead of the wrist). 1 = on (the default); 0: the wrist within the ring. The
; Reloading tab has them.
LoadPointOffset=0.000 0.085 0.100
LoadPointRadius=0.050
InsertOnTouch=1
LeverControl=hold
ForegripZoneRadius=0.110
RoundOffsetRight=-0.010 -0.044 0.016
RoundAxisRight=-0.421 -0.037 -0.906
MagazineOffsetRight=-0.034 0.000 -0.060
MagazineTurnRight=0
MagazineTiltRight=0
RamrodOffsetRight=0.010 -0.170 -0.045
RamrodTurnRight=5
RamrodTiltRight=55


[Physics]
; Grabbing loose props (run 5; the Gestures tab): an empty hand gripping at a loose prop (a bottle, a chair, a crate)
; holds it at the palm, frozen; letting go throws it with the hand's speed (times ThrowGain, at most ThrowMax m/s).
; While on, an empty hand's grip reaches the game (LB/RB) only once no prop was found there (a few frames late). NPCs
; are never grabbed. 1 = on.
Grab=0
GrabRadius=0.15
ThrowGain=1.0
ThrowMax=12.0
; Hands that push loose objects (run 3; the Gestures tab): an empty hand moving through a bottle, a crate or a chair
; pushes it along the hand, through the game's own natives (never an actor: NPCs react to [Gestures] Melee). 1 = on.
HandCollision=0
; the prop's speed along the hand per the hand's speed, its cap (m/s), the slowest hand that pushes (m/s), the reach from
; the palm to the prop's origin (m), and the time between a hand's pushes (ms)
PushGain=1.2
PushMax=5.0
PushMinSpeed=0.5
PushRadius=0.35
PushCooldownMs=120
; each distinct prop touched pins one of the game's 1024 script references for the session: at most this many props, and
; none while fewer references are free
MaxTouched=96
RefPoolFloor=256

[Gestures]
; While someone is on your lasso (on foot), the guns shown at your holsters are hidden, so the game's own "press Y to
; hogtie" works: its check sweeps between you and them, and the mod's holster props were in its way (2026-10-20, after
; optimumbox's finding). They show again a second after the rope is empty. 1 = on. Off until it is tried in a headset
; (the simulator cannot rope anyone, so it is not yet proven; 15 minutes of its watching ran without a fault).
HogtieClearProps=0
; The game's own timing, shortened for the player (round 8: the weapon leaves "a moment after I let go", and "a delay
; between when I swing and when the hit lands"): QuickThrow scales the throw clip's release point by ThrowRelease and its
; speed by ThrowRate (the throwables only: the lasso keeps the game's timing, 2026-11-01: early and fast, its loop
; caught the wrong thing or killed); MeleeStrike scales where in the punch clip the hit lands (1 = the game's timing).
QuickThrow=1
ThrowRelease=0.15
ThrowRate=1.5
MeleeStrike=0.35
; ThrowByGrip: hold the gun hand's grip to hold a throwable (unlit), pull the trigger to ready it (the game's aim: dynamite
; and fire bottles lit; a throwing knife held by its tip), swing and let go of the grip to throw. The game's throw clip is
; held just before its release while the grip is held (15 s at most), and let go with it. A lit one held past its fuse
; (about 3 s) goes off in the hand, as from the game's own aim. Off: the trigger throws as before.
ThrowByGrip=1
; With ThrowByGrip: dynamite or a fire bottle lit by the trigger and let go with the hand all but still drops from your
; hand (its fuse or flame running) instead of flying off at the game's own speed. 1 = on.
DropLitSlow=1
; KnifeTip (only with ThrowByGrip on): the readied throwing knife turned 180 deg about its local axis KnifeTipTurn
; (0 = x, 1 = y, 2 = z) through its local point KnifeTipPivot in m (the blade's middle: the tip comes to the grip). 1 = on.
KnifeTip=1
KnifeTipTurn=2
KnifeTipPivot=0 0.1 0
; With bare fists the game punches only from its fighting stance (LT), so a fist's swing holds LT and presses RT
; FistLeadMs later (run 3: RT alone never punched; 30 ms was the shortest lead that always did). The knife and the
; torch strike on RT alone. Measured from the swing, the strike lands about 155 ms later at MeleeStrike 0.35, 395 ms
; at 1.0.
FistLeadMs=40
; In first person (each off until judged in the headset; the menu's Gestures tab):
; Throw: a thrown weapon (dynamite, fire bottle, throwing knife, tomahawk) leaves your gun hand with its speed and
; direction (the fastest moment of the last 0.8 s, times ThrowGain) instead of the game's arc. Pull the trigger to
; throw as usual and swing. 1 = on.
Throw=1
ThrowGain=2.00
; Melee: a swing of either hand faster than SwingSpeed (m/s) attacks (fists, the knife, the torch). 1 = on.
Melee=1
; LassoThrow (new in 0.8.7; the swing, the hand's and the other hand's aim tried in the simulator only): what throws the lasso: trigger (the lasso hand's trigger: the game's aim held 0.3 s for
; its lock, then the throw), swing (a fast swing of the lasso hand toward the aim: overhand, sidearm or straight), or
; both. LassoAim (new in 0.8.7): what aims it: head (where you look), hand (the lasso hand's pointing, held still once
; a swing starts), or offhand (where the other controller points). Both only act with Lasso=1. The trigger and the
; head tried in a headset; the swing still hard to time. lock (new 2026-10-30): hold the game's aim (LT, the left
; trigger; left-handed, the right controller's) to lock on to the one you look at and spin the lasso (aimed by the head
; whatever LassoAim says); while LT is held, RT (the right trigger) or a swing toward where you look throws it at them
; (without LT neither throws), the lasso in either hand. LT let go without either: nothing thrown. Keep LT held
; to keep them on the rope (the game's rule); the yank as before.
LassoThrow=lock
LassoAim=head
; Lasso: with the lasso in hand, LassoThrow throws it (its trigger, or a swing faster than SwingSpeed toward the aim);
; a yank back (1.8 m/s) steps John back on the rope to pull. 1 = on.
Lasso=1
SwingSpeed=1.50
; GunMelee (run 7, not yet judged in the headset): hit someone with the gun in your hand by swinging it - a long gun's
; butt or barrel, a pistol's frame or barrel. No animation plays on John: the game's own melee hit is made on the
; person the swing passes through (the head, the chest, the belly or the hips), as a punch makes it: a knock-out
; blow by default, with the game's reactions, its crime and the person's anger. Not while the menu is open, in
; Dead Eye or a reload, riding, drawing or putting a gun away, working a gun's action by hand, or taking the
; two-handed grip. 1 = on.
GunMelee=1
; The swing: a scan for someone to hit starts when the strike point moves faster than GunMeleeArm (m/s), and a hit
; needs the swing's peak at GunMeleeSpeed (m/s) or more, the gun still moving into them at half of it as it reaches
; them (GunMeleeByPeak=0: GunMeleeSpeed at the contact itself). One hit per swing; the next swing counts once the gun
; slows below 0.8 m/s. The log's "swing over" line gives each swing's peak that hit nobody.
GunMeleeSpeed=1.00
GunMeleeArm=1.2
GunMeleeByPeak=1
; The hit's damage at GunMeleeSpeed (the game's weapons have MeleeDamage 10), doubled by GunMeleeHeavy (m/s), in between
; in proportion. GunMeleeLethal: 0 knocks out (the knock-out points, as fists do), 1 takes health.
GunMeleeDamage=10
GunMeleeHeavy=6.0
GunMeleeLethal=0
; How hard the hit pushes the person along the swing (the game's melee reads its own scale; the log's "calibration"
; line shows it at a punch while GunMelee is on).
GunMeleeForce=1.0
; Where a long gun's butt is: metres behind the gun's origin along its stock.
GunMeleeStockLen=0.40
; GunMeleeDryRun: find the hit and log it ("[gunmelee] dry hit ..."), but never make it. 1 = on.
GunMeleeDryRun=0
; Whistle for the horse (0.6.0; on by default since 0.7.0): a hand at the mouth and its trigger: the game's whistle.
; The point is WhistleOffset (right, up, forward, m) from between the eyes, within WhistleRadius (m). That trigger does
; nothing else while the hand is there. With a gun raised (the aim held), the whistle lets the aim go for up to 0.9 s
; first (the game whistles only out of its aim stance); a pull of the gun's trigger after the whistle brings the aim
; back. WhistleGunHand: the gun hand whistles too with a gun in it (0: only empty; at the cheek a gun aims). 1 = on.
Whistle=1
WhistleOffset=0.000 -0.080 0.080
WhistleRadius=0.10
WhistleGunHand=0
; Tip the hat (new in run 10): the right hand over the head (TipHatOffset: right, up, forward of the eyes' midpoint, m;
; within TipHatRadius) and its trigger: the game's greeting (pad B, as near someone in the game). That trigger does
; nothing else while the hand is there; never with a gun in that hand. 1 = on.
TipHat=1
TipHatOffset=0.000 0.130 0.080
TipHatRadius=0.13
; The guard (new in run 10): with the fists, both hands before the face (GuardBox in metres: forward min and max, up min
; and max from the eyes, across at most) hold the game's block for as long as they stay there: GuardButtons rb+lt (the
; fighting stance, then the block button), rb, or lt. Not riding, driving or in the game's menus. 1 = on.
; GuardTriggers=1: only while both controllers' triggers are held too (fists raised alone stay unarmed: the fighting
; stance alarms people nearby); 0: the hands in the box alone.
; FistsBothTriggers (2026-10-14): with nothing in hand on foot, both triggers held are the fighting stance and a swing
; of a fist punches while they are held (at SwingSpeed, whatever Melee says); both fists before the face block (the
; guard); either trigger let go ends the stance, and a trigger alone does nothing. 0 = each trigger as the game's.
FistsBothTriggers=1
Guard=1
GuardButtons=rb+lt
GuardBox=0.05 0.40 -0.25 0.10 0.25
GuardTriggers=1

[Horse]
; Riding in first person. Steering: stick = the view faces the horse and the left stick steers it (the head looks
; around freely); head = as on foot, the left stick goes where you look. The menu's Comfort tab.
Steering=stick
; StickTurn: with Steering=stick, the right stick turns the view on horseback as on foot ([Comfort] TurnMode), while the
; left stick still steers the horse; mounting and a recentre face the horse again. (Steering=head: the right stick
; always turns the view.) 1 = on.
StickTurn=1
; Driving a wagon or a coach (new in run 10): the view faces the vehicle's way and turns with it, as on a horse (the
; left stick steers it, the right stick turns the view as StickTurn does). The camera stays over John's own seat. 1 = on.
VehicleHeading=1
; MountRecentre (2026-11-02; after optimumbox's 0.8.11.11; the Horse tab, "Recentre on getting on"): getting on a
; horse, onto a wagon's bench or into a vehicle recentres the view (as holding both stick clicks does), once John has
; settled (1.2 s): you face the mount's forward, however you were turned before. 1 = on.
MountRecentre=1
; The view from the saddle: the camera above the horse's own position (no gait bounce in it), at the rider's eye
; height averaged over a second, instead of the bouncing head. 1 = on.
SaddleAnchor=1
; Its height smoothing, seconds (0 = none).
SaddleSmoothing=0.15
; On a climb the view keeps its height (run 6): the horse's own climb is fed into that smoothing, which otherwise fell
; behind by the climb's speed times its time (on a steep gallop your eyes sank to the saddle), and the view never goes
; below the rider's seat + 0.5 m. On flat ground it is the same as before. 1 = on.
SaddleClimb=1
; On a horse or a wagon the left stick click is the game's brake: hold it to slow down, with the stick pulled back for
; a hard stop (on foot it is still crouch). 1 = on.
StickClickBrake=1
; Riding, a revolver in the left hand (the second gun, or drawn by that hand) is cocked by a quick flick of the left
; stick down, as on foot (the horse's quick turn-around on that flick is given up); a longer pull back still reaches the
; horse, DualWieldOpenWaitMs later. 0 = riding, the left stick is the horse's alone. 1 = on.
LeftFlickCocks=1
; With Stance=still: John's body stays where it sat under your view when the horse speeds up, rears or gallops
; (the old way re-placed it on any 0.3 m jump of the riding animation, and it could settle back in the saddle). 1 = on.
BodyWithCamera=1

[Comfort]
; WorldScale (2026-10-13): how big the world looks. Every headset position put into the game (your eyes, so their
; separation too, your head's moves and your hands) is divided by it: above 1 the world looks bigger (you feel smaller),
; below 1 smaller. 0.5-2.0; 1.0 = true scale. The game's world, aiming and holsters are unchanged.
WorldScale=1.0
; Turning on the right stick: smooth (degrees per second) or snap (degrees per step).
TurnMode=smooth
TurnSpeed=90
SnapAngle=30

[Screen]
; Cutscenes on the cinema screen (Screen, the game's own camera at 16:9) or in 3D (both eyes from the cutscene camera,
; head rotation only). Switchable live ("mode cutscene screen|3d"), mid-cutscene included.
CutsceneMode=3D
; 3D cutscenes: the eye separation as a fraction of yours (1.0 = your IPD).
Cutscene3DSeparation=1.0
; Rain and blood drops on the lens (the game's screen overlay), in both eyes. 0 = none.
LensDrops=1

[Launcher]
; RDRVR_Launcher.exe (the game folder's RDRVR_Launcher subfolder) opens each time the game starts, however it was
; started (Steam, the Rockstar Games Launcher, RDR.exe), and the game waits for it before it makes its window: what is
; saved there applies to that start. Its Play, its Close or the countdown below lets the game go on. Never shown
; without RDRVR_Launcher\RDRVR_Launcher.exe, after the launcher's own Play started the game, or on the relaunch back to
; the menu. 0 = off (the game starts at once, as before). Read at the start.
ShowAtStart=1
; Seconds before the game goes on by itself when nobody presses Play (started from the headset): 5-300. A click or a
; key in the launcher stops the countdown; the game then waits for Play, 5 minutes at most. 0 = no countdown (the
; 5 minutes only). Read at the start.
StartTimeout=30

